<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>gpc-with-dd - Album</title>
    <link rel="stylesheet" href="css/styles.css?v=8" />
  </head>
  <body>
    <header class="topbar">
      <a href="albums.html" class="back">&larr; Albums</a>
      <button type="button" id="logout" class="ghost">Logout</button>
    </header>

    <main class="container">
      <p id="message" class="message" hidden></p>

      <div class="album-header">
        <h1 id="album-title">Loading&hellip;</h1>
        <span id="album-role" class="badge"></span>
        <button type="button" id="edit-album" class="ghost small-btn" hidden>
          Edit title
        </button>
        <button type="button" id="delete-album" class="ghost small-btn" hidden>
          Delete album
        </button>
        <button type="button" id="leave-album" class="ghost small-btn" hidden>
          Leave album
        </button>
      </div>

      <form id="edit-form" class="edit-form" hidden>
        <div class="inline-form">
          <input type="text" id="edit-title" required maxlength="255" />
          <button type="submit" class="primary">Save</button>
          <button type="button" id="edit-cancel" class="ghost">Cancel</button>
        </div>
      </form>

      <div id="stats" class="stats"></div>

      <section class="panel">
        <h2>Members</h2>
        <div id="member-list" class="member-list"></div>
      </section>

      <section class="panel">
        <h2>Photos</h2>
        <form id="upload-form" class="inline-form">
          <input
            type="file"
            id="photo-files"
            accept="image/*"
            multiple
            required
          />
          <button type="submit" class="primary">Upload</button>
        </form>
        <div id="photo-gallery" class="photo-grid"></div>
      </section>
    </main>

    <script type="module" src="js/album.js?v=9"></script>
  </body>
</html>
